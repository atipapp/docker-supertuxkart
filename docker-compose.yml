services:
  supertuxkart-server:
    build: .
    image: supertuxkart:1.5
    container_name: supertuxkart-server
    restart: unless-stopped
    ports:
      - "2757:2757/udp"   # LAN discovery
      - "2759:2759/udp"   # game traffic
    volumes:
      - "./server_config.xml:/stk/server_config.xml:ro"
    # LAN-only: no USERNAME / PASSWORD (those are only needed to register the
    # server on stk-addons for public/WAN play).
    #
    # Uncomment to add bots that fill empty slots:
    # environment:
    #   AI_KARTS: 2
