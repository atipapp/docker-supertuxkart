name: Build and push image

on:
  push:
    branches: [master]
    # Don't rebuild on doc-only changes
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "supertuxkart-logo.png"
  schedule:
    # Monthly refresh so the image picks up Ubuntu 24.04 security patches
    # and any updates to the stk-assets SVN trunk. 1st of month, 04:00 UTC.
    - cron: "0 4 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: pppttl
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: pppttl/supertuxkart-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=1.5,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
